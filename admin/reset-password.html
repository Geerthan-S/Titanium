<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <meta name="description" content="Set a new Titanium Roots clinic CMS password.">
    <title>Reset Admin Password | Titanium Roots</title>
    <link rel="icon" href="/favicon.ico">
    <link rel="stylesheet" href="/assets/css/global.css">
    <link rel="stylesheet" href="/assets/css/pages/admin.css">
</head>
<body data-admin-page="reset-password">
    <a class="skip-link" href="#admin-content">Skip to password reset</a>
    <main class="admin-login admin-login--reset" id="admin-content">
        <section class="admin-login__brand" aria-labelledby="reset-brand-title">
            <div class="admin-login__brand-inner">
                <span class="admin-login__mark"><i data-lucide="shield-check" aria-hidden="true"></i></span>
                <p class="admin-login__eyebrow">Titanium Roots Dental Clinic</p>
                <h1 id="reset-brand-title">Protect your clinic workspace.</h1>
                <p>Choose a unique password that is not used for another account.</p>
            </div>
        </section>
        <section class="admin-login__form-panel" aria-labelledby="reset-title">
            <form class="admin-login-form" data-admin-reset-form novalidate>
                <p class="admin-login-form__eyebrow">Clinic CMS</p>
                <h2 id="reset-title">Set a new password</h2>
                <p>Use at least 12 characters and enter the same password twice.</p>
                <div class="admin-error-summary" role="status" aria-live="polite" tabindex="-1" hidden data-reset-status></div>
                <label>New password<input name="password" type="password" autocomplete="new-password" minlength="12" required></label>
                <label>Confirm password<input name="confirmation" type="password" autocomplete="new-password" minlength="12" required></label>
                <button class="admin-button admin-button--primary admin-login-form__submit" type="submit" data-reset-submit>
                    <span>Update password</span><i data-lucide="arrow-right" aria-hidden="true"></i>
                </button>
                <a class="admin-login-form__website" href="/admin/login.html"><i data-lucide="arrow-left" aria-hidden="true"></i>Return to sign in</a>
            </form>
        </section>
    </main>
    <script type="module" src="/assets/js/pages/admin-reset-password.js"></script>
</body>
</html>
