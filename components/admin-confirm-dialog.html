<section class="admin-dialog" role="dialog" aria-modal="true" aria-labelledby="admin-confirm-title" hidden
    data-admin-confirm>
    <div class="admin-dialog__panel">
        <span class="admin-dialog__icon" aria-hidden="true"><i data-lucide="triangle-alert"></i></span>
        <h2 id="admin-confirm-title" data-confirm-title>Confirm action</h2>
        <p data-confirm-message>This action changes live clinic content.</p>
        <div class="admin-dialog__actions">
            <button class="admin-button admin-button--quiet" type="button" data-confirm-cancel>Cancel</button>
            <button class="admin-button admin-button--danger" type="button" data-confirm-accept>Confirm</button>
        </div>
    </div>
</section>
